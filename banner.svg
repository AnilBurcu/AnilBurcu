<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Anıl Bürcü — full-stack mobile engineer. One delivery path: schema, API, app, test, release, operate.">
  <defs>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="940" y2="0">
      <stop offset="0%"   stop-color="#3FCF8E"/>
      <stop offset="16%"  stop-color="#22D3EE"/>
      <stop offset="33%"  stop-color="#3B82F6"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="66%"  stop-color="#EC4899"/>
      <stop offset="83%"  stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    :root {
      --fg: #14181d;
      --muted: #5b6570;
      --track: rgba(20, 24, 29, 0.11);
      --node: #98a2ad;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8eef5;
        --muted: #8d99a6;
        --track: rgba(232, 238, 245, 0.13);
        --node: #6d7885;
      }
    }

    .name {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 31px;
      font-weight: 600;
      letter-spacing: 0.4px;
      fill: var(--fg);
    }
    .role, .tick {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      fill: var(--muted);
    }
    .role { font-size: 11px; letter-spacing: 2.7px; }
    .tick { font-size: 9.5px; letter-spacing: 1.7px; opacity: 0.72; }

    .track { stroke: var(--track); stroke-width: 4.5; stroke-linecap: round; }
    .node  { fill: var(--node); opacity: 0.4; }

    .trail {
      stroke: url(#signal);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 90 880;
      animation: trail 8s linear infinite;
    }
    /* The head cannot use url(#signal): a userSpaceOnUse gradient travels with
       the transformed element, so the dot would keep its start colour while the
       trail behind it shifted. Its fill is keyed to the same stops in time. */
    .head { fill: #3FCF8E; animation: head 8s linear infinite, headColour 8s linear infinite; }
    .carrier { animation: travel 8s linear infinite; }

    /* Each node flashes in the colour the signal carries when it arrives. */
    .n0 { --flash: #3FCF8E; animation: charge 8s linear infinite; animation-delay: 0s; }
    .n1 { --flash: #28C0F0; animation: charge 8s linear infinite; animation-delay: 1.152s; }
    .n2 { --flash: #5C72F6; animation: charge 8s linear infinite; animation-delay: 2.304s; }
    .n3 { --flash: #C850BC; animation: charge 8s linear infinite; animation-delay: 3.456s; }
    .n4 { --flash: #F86A89; animation: charge 8s linear infinite; animation-delay: 4.608s; }
    .n5 { --flash: #FBBF24; animation: charge 8s linear infinite; animation-delay: 5.76s; }

    .t0 { animation: label 8s linear infinite; animation-delay: 0s; }
    .t1 { animation: label 8s linear infinite; animation-delay: 1.152s; }
    .t2 { animation: label 8s linear infinite; animation-delay: 2.304s; }
    .t3 { animation: label 8s linear infinite; animation-delay: 3.456s; }
    .t4 { animation: label 8s linear infinite; animation-delay: 4.608s; }
    .t5 { animation: label 8s linear infinite; animation-delay: 5.76s; }

    @keyframes travel {
      0%   { transform: translateX(0px); }
      72%  { transform: translateX(880px); }
      100% { transform: translateX(880px); }
    }
    @keyframes trail {
      0%   { stroke-dashoffset: 90; opacity: 0; }
      4%   { opacity: 1; }
      66%  { opacity: 1; }
      72%  { stroke-dashoffset: -790; opacity: 0; }
      100% { stroke-dashoffset: -790; opacity: 0; }
    }
    @keyframes head {
      0%   { opacity: 0; }
      4%   { opacity: 1; }
      66%  { opacity: 1; }
      73%  { opacity: 0; }
      100% { opacity: 0; }
    }
    /* Stops of #signal mapped onto the fraction of the cycle the head needs
       to reach them, so head and trail always agree. */
    @keyframes headColour {
      0%     { fill: #3FCF8E; }
      11.5%  { fill: #22D3EE; }
      23.8%  { fill: #3B82F6; }
      36%    { fill: #8B5CF6; }
      47.5%  { fill: #EC4899; }
      59.8%  { fill: #FB7185; }
      72%    { fill: #FBBF24; }
      100%   { fill: #FBBF24; }
    }
    @keyframes charge {
      0%   { opacity: 0.4; r: 4;   fill: var(--node); }
      3%   { opacity: 1;   r: 7;   fill: var(--flash); }
      11%  { opacity: 0.4; r: 4;   fill: var(--node); }
      100% { opacity: 0.4; r: 4;   fill: var(--node); }
    }
    @keyframes label {
      0%   { opacity: 0.72; }
      3%   { opacity: 1; }
      14%  { opacity: 0.72; }
      100% { opacity: 0.72; }
    }

    @media (prefers-reduced-motion: reduce) {
      .trail, .head, .carrier, .node, .tick { animation: none; }
      .trail { opacity: 0.9; stroke-dasharray: none; }
      .node  { opacity: 0.9; }
    }
  </style>

  <text class="name" x="60" y="55">Anıl Bürcü</text>
  <text class="role" x="62" y="78">FULL-STACK MOBILE ENGINEER</text>

  <line class="track" x1="60" y1="113" x2="940" y2="113"/>
  <line class="trail" x1="60" y1="113" x2="940" y2="113"/>

  <circle class="node n0" cx="60"  cy="113" r="4"/>
  <circle class="node n1" cx="236" cy="113" r="4"/>
  <circle class="node n2" cx="412" cy="113" r="4"/>
  <circle class="node n3" cx="588" cy="113" r="4"/>
  <circle class="node n4" cx="764" cy="113" r="4"/>
  <circle class="node n5" cx="940" cy="113" r="4"/>

  <g class="carrier">
    <circle class="head" cx="60" cy="113" r="4.5" filter="url(#glow)"/>
  </g>

  <text class="tick t0" x="60"  y="137" text-anchor="middle">SCHEMA</text>
  <text class="tick t1" x="236" y="137" text-anchor="middle">API</text>
  <text class="tick t2" x="412" y="137" text-anchor="middle">APP</text>
  <text class="tick t3" x="588" y="137" text-anchor="middle">TEST</text>
  <text class="tick t4" x="764" y="137" text-anchor="middle">RELEASE</text>
  <text class="tick t5" x="940" y="137" text-anchor="middle">OPERATE</text>
</svg>
